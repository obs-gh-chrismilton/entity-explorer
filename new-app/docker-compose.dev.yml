version: '3.8'

# Development override for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Backend API Service - Development Mode
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: deps  # Use deps stage for development (has devDependencies like tsx)
    command: npm run dev
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for hot reload
      - ./backend/src:/app/src:delegated
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      # Note: node_modules comes from the Docker image (deps stage)
    ports:
      - "3001:3001"
      - "9229:9229"  # Node.js debugger port
    stdin_open: true
    tty: true

  # Frontend Web Service - Development Mode
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: builder  # Use builder stage for development
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3001
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src:delegated
      - ./frontend/public:/app/public:delegated
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontend/tailwind.config.js:/app/tailwind.config.js:ro
      - ./frontend/postcss.config.js:/app/postcss.config.js:ro
      # Note: node_modules comes from the Docker image (builder stage)
    ports:
      - "5173:5173"  # Vite dev server
    stdin_open: true
    tty: true
    depends_on:
      - backend
